<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Tax Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Sales Tax Calculator</h1>
    <p class="subtitle">Tax rate: 8.25%</p>

    <form id="taxForm">
      <label for="purchase">Purchase Amount ($)</label>
      <input type="number" id="purchase" min="0" step="0.01" placeholder="0.00" required>

      <button type="button" id="calcBtn">Calculate</button>

      <label for="tax">Tax Amount ($)</label>
      <input type="text" id="tax" disabled>

      <label for="total">Total ($)</label>
      <input type="text" id="total" disabled>
    </form>
  </main>

  <script>
    const TAX_RATE = 0.0825;

    document.getElementById("calcBtn").addEventListener("click", function () {
      const amount = parseFloat(document.getElementById("purchase").value);

      if (isNaN(amount) || amount < 0) {
        alert("Please enter a valid purchase amount.");
        return;
      }

      const tax = amount * TAX_RATE;
      const total = amount + tax;

      document.getElementById("tax").value = tax.toFixed(2);
      document.getElementById("total").value = total.toFixed(2);
    });
  </script>
</body>
</html>
