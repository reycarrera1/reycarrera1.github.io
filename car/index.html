
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Favorite Cars</title>

    <!-- Connect CSS stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Connect JavaScript file -->
    <script src="code.js" defer></script>
</head>

<body>

    <header>
        <h1>My Favorite Cars</h1>
        <p>Explore five different cars and their features!</p>
    </header>

    <main>
        <h2>Car Collection</h2>

        <table>
            <thead>
                <tr>
                    <th>Make</th>
                    <th>Model</th>
                    <th>Year</th>
                    <th>Color</th>
                    <th>Horsepower</th>
                </tr>
            </thead>

            <tbody id="carTable">
                <!-- JavaScript will display cars here -->
            </tbody>
        </table>
    </main>

    <footer>
        <p>JavaScript Objects and Arrays Assignment</p>
    </footer>

</body>
</html>
